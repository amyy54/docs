site_name: Amy
site_url: https://amyy.me
theme:
  name: amyy-theme
  fit_to_height: true

extra:
  static_location: !ENV [STATIC_LOCATION, /static]

plugins:
  - macros
  - redirects:
      redirect_maps:
        'development/ahit-archipelago.md': 'misc/development/ahit-archipelago.md'
        'development/n64-wii.md': 'misc/development/n64-wii.md'
        'archive/livesplit.md': 'misc/archive/livesplit.md'
        'archive/resizelinux.md': 'misc/archive/resizelinux.md'
        'blogs/analyzer.md': 'misc/blogs/analyzer.md'
        'blogs/uformat.md': 'misc/blogs/uformat.md'

nav:
  - Site Directory: 'directory/index.md'
  - CTF Writeups: 'ctfs/index.md'
#  - Projects: 'development/index.md'
  - Miscellaneous: 'misc/index.md'
