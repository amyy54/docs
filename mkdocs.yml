site_name: Amy
site_url: https://amyy.me
docs_dir: 'src'
theme:
  name: amyy-theme
  fit_to_height: true
  css_location: !ENV [CSS_LOCATION, /css]
  js_location: !ENV [JS_LOCATION, /js]

extra:
  static_location: !ENV [STATIC_LOCATION, /static]

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

plugins:
  - macros

nav:
  - Site Directory: 'directory.md'
  - CTF Writeups: 'docs/ctfs/index.md'
  - Miscellaneous: 'docs/index.md'
